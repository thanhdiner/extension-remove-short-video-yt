<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hide Shorts</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="logo-area">
          <img src="icon32.png" class="logo-img" alt="Logo">
          <h1>Hide YouTube Shorts</h1>
        </div>
      </header>

      <!-- Toggle Switch -->
      <label class="switch-container">
        <span>Bật ẩn Shorts</span>
        <div class="switch">
          <input type="checkbox" id="toggleEnabled" />
          <span class="switch-slider"></span>
        </div>
      </label>

      <!-- Toggle Switch for NotebookLM -->
      <label class="switch-container">
        <span>Tối ưu NotebookLM</span>
        <div class="switch">
          <input type="checkbox" id="toggleNotebook" />
          <span class="switch-slider"></span>
        </div>
      </label>

      <!-- Custom Redirect Select -->
      <div class="row">
        <span>Đi vào /shorts/ thì</span>
        <div class="custom-select-container">
          <div class="custom-select-wrapper">
            <button type="button" class="custom-select-trigger" id="modeTrigger" aria-haspopup="listbox" aria-expanded="false">
              <span class="custom-select-value">Chặn (về Home)</span>
              <span class="custom-select-arrow">
                <svg xmlns="http://www.w3.org/2000/svg" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
              </span>
            </button>
            <ul class="custom-select-options hidden" role="listbox" id="modeOptions">
              <li class="custom-option selected" data-value="block" role="option" aria-selected="true">
                <span>Chặn (về Home)</span>
                <span class="check-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </span>
              </li>
              <li class="custom-option" data-value="watch" role="option" aria-selected="false">
                <span>Chuyển sang watch</span>
                <span class="check-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </span>
              </li>
            </ul>
            <!-- Hidden native select for JS compatibility -->
            <select id="redirectMode" class="hidden">
              <option value="block" selected>Chặn (về Home)</option>
              <option value="watch">Chuyển sang watch</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Toggle Switch for AltScroll -->
      <label class="switch-container">
        <span>Cuộn chuột nhanh (phím Alt)</span>
        <div class="switch">
          <input type="checkbox" id="toggleAltScroll" />
          <span class="switch-slider"></span>
        </div>
      </label>

      <!-- Toggle Switch for AltScroll Smooth -->
      <label class="switch-container">
        <span>Cuộn mượt mà (phím Alt)</span>
        <div class="switch">
          <input type="checkbox" id="smoothScroll" />
          <span class="switch-slider"></span>
        </div>
      </label>

      <!-- AltScroll Speed Multiplier Slider -->
      <div class="control-group" style="margin-bottom: 12px;">
        <div class="range-container">
          <div class="range-header">
            <span>Hệ số tốc độ cuộn</span>
            <span id="speedValue">5x</span>
          </div>
          <div class="range-slider-wrapper">
            <input type="range" id="speed" min="1" max="20" value="5" step="0.5">
          </div>
        </div>
      </div>

      <!-- Toggle Switch for Custom YouTube Seek -->
      <label class="switch-container">
        <span>Tua video bằng mũi tên</span>
        <div class="switch">
          <input type="checkbox" id="toggleCustomSeek" />
          <span class="switch-slider"></span>
        </div>
      </label>

      <!-- Custom Seek Seconds Slider -->
      <div class="control-group" style="margin-bottom: 12px;">
        <div class="range-container">
          <div class="range-header">
            <span>Thời gian tua bằng mũi tên</span>
            <span id="seekValue">20s</span>
          </div>
          <div class="range-slider-wrapper">
            <input type="range" id="seekSeconds" min="1" max="120" value="20" step="1">
          </div>
        </div>
      </div>

      <!-- Action Button -->
      <div class="row" style="justify-content: flex-end; margin-bottom: 8px;">
        <button id="apply" class="primary">Áp dụng</button>
      </div>

      <!-- Footer tips -->
      <footer class="tip-footer">
        Mẹo: nếu YouTube đổi DOM, bật/tắt lại để refresh observer.
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
